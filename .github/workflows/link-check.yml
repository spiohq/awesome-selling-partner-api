name: Link Check

on:
  schedule:
    - cron: "0 6 * * 1"   # Every Monday at 06:00 UTC
  workflow_dispatch:        # Allow manual runs

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      exit_code: ${{ steps.lychee.outputs.exit_code }}
    steps:
      - uses: actions/checkout@v4

      - name: Run lychee
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --accept 403,429
            --exclude-loopback
            --no-progress
            --format markdown
            --output lychee_out.md
            README.md
          fail: false   # Don't fail the step; we handle exit_code ourselves

      - name: Upload lychee report
        if: steps.lychee.outputs.exit_code != '0'
        uses: actions/upload-artifact@v4
        with:
          name: lychee-report
          path: lychee_out.md

  fix:
    needs: check
    if: needs.check.outputs.exit_code != '0'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Download lychee report
        uses: actions/download-artifact@v4
        with:
          name: lychee-report

      - name: Remove dead-link lines from README
        run: |
          # Extract only failed URLs from lychee report (lines containing [ERROR] or [x])
          grep -oP '(?<=\| \[)[^\]]+(?=\].*\| [45]\d\d )' lychee_out.md | sort -u > dead_urls.txt || true
          # Fallback: if first pattern matches nothing, try simpler extraction of non-2xx lines
          if [ ! -s dead_urls.txt ]; then
            grep -E '\| [45][0-9]{2} ' lychee_out.md | grep -oP 'https?://[^\s|)>\]]+' | sort -u > dead_urls.txt || true
          fi
          echo "Dead URLs to remove:"
          cat dead_urls.txt
          if [ ! -s dead_urls.txt ]; then
            echo "No dead URLs extracted from report, skipping README modification."
            exit 0
          fi
          # Write the helper script to a file to avoid quoting issues inside YAML
          cat > /tmp/remove_url.py << 'PYEOF'
          import sys
          url = sys.argv[1]
          readme = sys.argv[2]
          with open(readme) as fh:
              lines = fh.readlines()
          with open(readme, "w") as fh:
              for line in lines:
                  if url not in line:
                      fh.write(line)
          PYEOF
          while IFS= read -r url; do
            python3 /tmp/remove_url.py "$url" README.md
          done < dead_urls.txt

      - name: Build PR body
        id: pr_body
        run: |
          REPORT=$(cat lychee_out.md)
          DELIM="ghadelimiter_$(openssl rand -hex 8)"
          {
            echo "body<<$DELIM"
            echo "## Dead Links Removed"
            echo ""
            echo "The weekly link checker found broken URLs and removed them from \`README.md\`."
            echo ""
            echo "<details><summary>Lychee report</summary>"
            echo ""
            echo "$REPORT"
            echo ""
            echo "</details>"
            echo ""
            echo "> Auto-generated by the [link-check workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: fix/dead-links-${{ github.run_id }}
          title: "fix: remove dead links found by weekly link check"
          body: ${{ steps.pr_body.outputs.body }}
          commit-message: "fix: remove dead links detected by lychee"
          labels: maintenance
          delete-branch: true
