name: Link Check

on:
  schedule:
    - cron: "0 6 * * 1"   # Every Monday at 06:00 UTC
  workflow_dispatch:        # Allow manual runs

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      exit_code: ${{ steps.lychee.outputs.exit_code }}
    steps:
      - uses: actions/checkout@v4

      - name: Run lychee
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --accept 403,429
            --exclude-loopback
            --no-progress
            --format markdown
            --output lychee_out.md
            README.md
          fail: false   # Don't fail the step; we handle exit_code ourselves

      - name: Upload lychee report
        if: steps.lychee.outputs.exit_code != '0'
        uses: actions/upload-artifact@v4
        with:
          name: lychee-report
          path: lychee_out.md

  fix:
    needs: check
    if: needs.check.outputs.exit_code != '0'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Download lychee report
        uses: actions/download-artifact@v4
        with:
          name: lychee-report

      - name: Remove dead-link lines from README
        run: |
          # Extract URLs marked as broken (lychee markdown format: [ERROR] or status >= 400)
          grep -oP 'https?://[^\s)>\]]+' lychee_out.md | sort -u > dead_urls.txt
          echo "Dead URLs found:"
          cat dead_urls.txt
          while IFS= read -r url; do
            # Escape special characters for sed
            escaped=$(printf '%s\n' "$url" | sed 's/[[\.*^$()+?{|]/\\&/g')
            # Delete any line in README.md that contains this URL
            sed -i "/\($escaped\)/d" README.md
          done < dead_urls.txt

      - name: Build PR body
        id: pr_body
        run: |
          REPORT=$(cat lychee_out.md)
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "## Dead Links Removed" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "The weekly link checker found broken URLs and removed them from \`README.md\`." >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "<details><summary>Lychee report</summary>" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "$REPORT" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "</details>" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "> Auto-generated by the [link-check workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: fix/dead-links-${{ github.run_id }}
          title: "fix: remove dead links found by weekly link check"
          body: ${{ steps.pr_body.outputs.body }}
          commit-message: "fix: remove dead links detected by lychee"
          labels: maintenance
          delete-branch: true
