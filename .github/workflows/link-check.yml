name: Link Check

on:
  schedule:
    - cron: "0 6 * * 1"   # Every Monday at 06:00 UTC
  workflow_dispatch:        # Allow manual runs

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      exit_code: ${{ steps.lychee.outputs.exit_code }}
    steps:
      - uses: actions/checkout@v4

      - name: Run lychee
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --accept 403,429
            --exclude-loopback
            --no-progress
            --format markdown
            --output lychee_out.md
            README.md
          fail: false   # Don't fail the step; we handle exit_code ourselves

      - name: Upload lychee report
        if: steps.lychee.outputs.exit_code != '0'
        uses: actions/upload-artifact@v4
        with:
          name: lychee-report
          path: lychee_out.md

  fix:
    needs: check
    if: needs.check.outputs.exit_code != '0'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Download lychee report
        uses: actions/download-artifact@v4
        with:
          name: lychee-report

      - name: Remove dead-link lines from README
        id: remove_links
        run: |
          grep -oP '(?<=\| \[)[^\]]+(?=\].*\| [45]\d\d )' lychee_out.md | sort -u > dead_urls.txt || true
          if [ ! -s dead_urls.txt ]; then
            grep -E '\| [45][0-9]{2} ' lychee_out.md | grep -oP 'https?://[^\s|)>\]]+' | sort -u > dead_urls.txt || true
          fi
          echo "Dead URLs to remove:"
          cat dead_urls.txt
          if [ ! -s dead_urls.txt ]; then
            echo "No dead URLs extracted from report, skipping README modification."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "aW1wb3J0IHN5cwp1cmwgPSBzeXMuYXJndlsxXQp3aXRoIG9wZW4oIlJFQURNRS5tZCIsICJyIikgYXMgZjoKICAgIGxpbmVzID0gZi5yZWFkbGluZXMoKQp3aXRoIG9wZW4oIlJFQURNRS5tZCIsICJ3IikgYXMgZjoKICAgIGZvciBsaW5lIGluIGxpbmVzOgogICAgICAgIGlmIHVybCBub3QgaW4gbGluZToKICAgICAgICAgICAgZi53cml0ZShsaW5lKQo=" | base64 -d > /tmp/remove_url.py
          cp README.md README.md.bak
          while IFS= read -r url; do
            python3 /tmp/remove_url.py "$url"
          done < dead_urls.txt
          if diff -q README.md README.md.bak > /dev/null 2>&1; then
            echo "README.md unchanged after URL removal."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "README.md modified."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          rm README.md.bak

      - name: Build PR body
        id: pr_body
        if: steps.remove_links.outputs.changed == 'true'
        run: |
          REPORT=$(cat lychee_out.md)
          DELIM="ghadelimiter_$(openssl rand -hex 8)"
          {
            echo "body<<$DELIM"
            echo "## Dead Links Removed"
            echo ""
            echo "The weekly link checker found broken URLs and removed them from \`README.md\`."
            echo ""
            echo "<details><summary>Lychee report</summary>"
            echo ""
            echo "$REPORT"
            echo ""
            echo "</details>"
            echo ""
            echo "> Auto-generated by the [link-check workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        if: steps.remove_links.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: fix/dead-links-${{ github.run_id }}
          title: "fix: remove dead links found by weekly link check"
          body: ${{ steps.pr_body.outputs.body }}
          commit-message: "fix: remove dead links detected by lychee"
          labels: maintenance
          delete-branch: true
